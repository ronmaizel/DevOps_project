services:
  web:
    build: ./web
    container_name: web
    ports:
      - "80:80"
    volumes:
      - shared_media:/media
    depends_on:
      - app

  app:
    build: ./app
    container_name: app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:Aa123456@db:5432/postgres
    depends_on:
      - db
    volumes:
      - shared_media:/media
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Aa123456
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  shared_media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: C:\Users\Ronmz\OneDrive\Desktop\Ron\DevOps\Docker Compose Project
  db_data:
